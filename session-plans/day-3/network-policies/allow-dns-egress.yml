apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: default
spec:
  podSelector: {}     # applies to all Pods in the namespace
  policyTypes:
    - Egress
  egress:
    # DNS resolution breaks under default-deny-egress without this rule.
    # kube-dns runs on UDP/TCP 53 in the kube-system namespace.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
