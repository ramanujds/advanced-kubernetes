apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: default
spec:
  podSelector: {}     # allow scraping of all Pods in the namespace
  policyTypes:
    - Ingress
  ingress:
    # AND logic: traffic must come from a Pod labelled app=prometheus
    # that is also in a namespace labelled kubernetes.io/metadata.name=monitoring.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
