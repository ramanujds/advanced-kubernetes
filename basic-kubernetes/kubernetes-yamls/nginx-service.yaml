---
# ClusterIP — internal only (default)
apiVersion: v1
kind: Service
metadata:
  name: nginx-clusterip
spec:
  type: ClusterIP
  selector:
    app: nginx            # routes to pods with this label
  ports:
    - protocol: TCP
      port: 80            # port the service listens on
      targetPort: 80      # port on the pod

---
# NodePort — accessible on <NodeIP>:<nodePort> from outside
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80            # cluster-internal port
      targetPort: 80      # pod port
      nodePort: 30080     # external port (30000–32767); omit to auto-assign

---
# LoadBalancer — provisions a cloud external load balancer
apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
