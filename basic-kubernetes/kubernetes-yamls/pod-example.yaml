apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx
    env: dev
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
      env:
        - name: ENV_NAME
          value: "development"
      # Mount a volume into the container
      volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d
  # Init container runs to completion before main container starts
  initContainers:
    - name: init-check
      image: busybox
      command: ["sh", "-c", "echo Init complete"]
  volumes:
    - name: config-volume
      configMap:
        name: nginx-config   # must exist before applying this pod
  restartPolicy: Always      # Always | OnFailure | Never
