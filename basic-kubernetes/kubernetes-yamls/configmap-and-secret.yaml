---
# ConfigMap — store non-sensitive config as key-value pairs or files
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  # Simple key-value (consumed as env vars)
  APP_ENV: "production"
  LOG_LEVEL: "info"
  # File content (consumed as a mounted volume)
  default.conf: |
    server {
        listen 80;
        location / {
            root /usr/share/nginx/html;
        }
    }

---
# Secret — store sensitive data base64-encoded
# Create imperatively (recommended to avoid committing secrets):
#   kubectl create secret generic db-secret \
#     --from-literal=username=admin \
#     --from-literal=password=s3cr3t
#
# Or declaratively (values must be base64-encoded):
#   echo -n 'admin'  | base64   →  YWRtaW4=
#   echo -n 's3cr3t' | base64   →  czNjcjN0
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
data:
  username: YWRtaW4=     # base64("admin")
  password: czNjcjN0     # base64("s3cr3t")

---
# How to consume ConfigMap and Secret in a Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-with-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: nginx:1.27
          # Inject all ConfigMap keys as env vars
          envFrom:
            - configMapRef:
                name: nginx-config
          # Inject individual Secret keys as env vars
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
          # Mount ConfigMap as a file
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
            items:
              - key: default.conf
                path: default.conf
